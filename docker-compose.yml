services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buntuask}
      POSTGRES_USER: ${POSTGRES_USER:-buntu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buntu_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - buntu_internal

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - buntu_internal

  storage:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - minio_data:/data
    networks:
      - buntu_internal

  storage_init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/buntu-media;
      mc anonymous set none local/buntu-media;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - buntu_internal

  whatsapp_sidecar:
    build:
      context: ./whatsapp_service
    environment:
      REDIS_URL: redis://cache:6379/0
      WHATSAPP_AUTH_DIR: /app/auth
      PORT: 3000
    depends_on:
      cache:
        condition: service_healthy
    volumes:
      - whatsapp_auth:/app/auth
    expose:
      - "3000"
    networks:
      - buntu_internal

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-buntu}:${POSTGRES_PASSWORD:-buntu_dev_password}@db:5432/${POSTGRES_DB:-buntuask}
      REDIS_URL: redis://cache:6379/0
      S3_ENDPOINT_URL: http://storage:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_NAME: buntu-media
      FRONTEND_DIST_DIR: /app/frontend_dist
      WHATSAPP_SIDECAR_URL: http://whatsapp_sidecar:3000
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage_init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./frontend/dist:/app/frontend_dist:ro
    networks:
      - buntu_internal

networks:
  buntu_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  whatsapp_auth:
